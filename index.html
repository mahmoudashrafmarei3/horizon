<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Horizon Real Estate</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#000;
    color:white;
    overflow-x:hidden;
}


/* =========================
   NAVBAR
========================= */

nav{

    width:100%;
    padding:20px 8%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    position:fixed;
    top:0;
    left:0;

    z-index:1000;

    background:rgba(0,0,0,0.35);
    backdrop-filter:blur(10px);

    border-bottom:1px solid rgba(255,255,255,.05);

    transition:all .4s ease;
}

.logo{

    font-size:28px;
    font-weight:700;

    color:#d4af37;

    letter-spacing:3px;

    text-shadow:0 0 15px rgba(212,175,55,.35);
}

nav ul{

    display:flex;

    list-style:none;

    gap:30px;
}

nav ul li a{

    color:white;

    text-decoration:none;

    font-size:16px;

    position:relative;

    transition:all .35s ease;
}






/* =========================
   HERO SECTION
========================= */

.hero{

    width:100%;
    height:100vh;

    position:relative;

    overflow:hidden;
}


/* =========================
   HERO SLIDES
========================= */

.slide{

    position:absolute;

    width:100%;
    height:100%;

    background-size:cover;
    background-position:center;

    opacity:0;

    animation:zoom 18s infinite;
}

.slide::before{

    content:'';

    position:absolute;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.6);
}


/* =========================
   HERO IMAGES
========================= */

.slide1{
    background-image:url('img/hero1.jpg');
    animation-delay:0s;
}

.slide2{
    background-image:url('img/hero2.jpg');
    animation-delay:6s;
}

.slide3{
    background-image:url('img/hero3.jpg');
    animation-delay:12s;
}


/* =========================
   HERO ANIMATION
========================= */

@keyframes zoom{

    0%{
        opacity:0;
        transform:scale(1);
    }

    10%{
        opacity:1;
    }

    30%{
        opacity:1;
        transform:scale(1.08);
    }

    40%{
        opacity:0;
    }

    100%{
        opacity:0;
        transform:scale(1);
    }

}


/* =========================
   HERO CONTENT
========================= */


.hero-content{

    position:relative;
    z-index:5;

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:20px;

    animation:fadeUp 1.2s ease;
}

.hero-content h1{

    font-size:85px;

    color:#d4af37;

    margin-bottom:20px;

    letter-spacing:5px;
}

.hero-content p{

    font-size:22px;

    color:#ddd;

    margin-bottom:35px;
}


/* =========================
   HERO BUTTONS
========================= */

.hero-buttons{

    display:flex;

    justify-content:center;

    gap:20px;

    flex-wrap:wrap;
}
.btn{

    padding:14px 35px;

    border-radius:50px;

    text-decoration:none;

    transition:all .35s ease;

    font-size:16px;

    display:inline-block;

    will-change:transform;
}

.btn-gold{

    background:#d4af37;

    color:black;

    font-weight:bold;
}
.btn-gold:hover{

    transform:translateY(-2px);

    box-shadow:0 8px 20px rgba(212,175,55,.25);
}

.btn-dark{

    border:1px solid #d4af37;

    color:#d4af37;

    background:transparent;
}

.btn-dark:hover{

    background:#d4af37;

    color:black;

    transform:translateY(-4px);

    box-shadow:0 10px 25px rgba(212,175,55,.25);
}
/* =========================
   LOCATION BUTTON
========================= */

.location-wrapper{

    margin-top:30px;

    display:flex;

    justify-content:center;
}

.location-main-btn{

    display:inline-flex;

    align-items:center;

    gap:10px;

    padding:15px 45px;

    border-radius:50px;

    background:#d4af37;

    color:black;

    text-decoration:none;

    font-weight:bold;

    font-size:18px;

    transition:0.3s;
}

.location-main-btn:hover{

    transform:scale(1.05);
}


/* =========================
   CONTACT SECTION
========================= */

.contact{

    padding:100px 8%;

    text-align:center;

    position:relative;
    z-index:10;
}

.contact-box{

    max-width:700px;

    margin:auto;

    background:rgba(0,0,0,0.35);

    backdrop-filter:blur(10px);

    border-radius:25px;

    padding:50px;

    border:1px solid rgba(255,255,255,0.08);

    transition:all .4s ease;
}


.contact-box:hover{

    transform:translateY(-6px);

    border-color:rgba(212,175,55,.35);

    box-shadow:0 15px 40px rgba(212,175,55,.12);
}

.contact h2{

    font-size:50px;

    color:#d4af37;

    margin-bottom:20px;
}

.contact p{

    color:#bbb;

    margin-bottom:40px;
}

.contact form{

    display:flex;

    flex-direction:column;

    gap:20px;
}

.contact input,
.contact select{

    padding:18px;

    border:1px solid transparent;

    border-radius:12px;

    background:rgba(255,255,255,0.08);

    color:white;

    font-size:16px;

    outline:none;

    transition:all .35s ease;
}

.contact input:focus,
.contact select:focus{

    border-color:#d4af37;

    box-shadow:0 0 15px rgba(212,175,55,.25);

    background:rgba(255,255,255,0.12);
}

.contact button{

    padding:18px;

    border:none;

    border-radius:12px;

    background:#d4af37;

    color:black;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

.contact button:hover{

    transform:scale(1.03);
}


/* =========================
   FOOTER
========================= */

footer{

    padding:30px;

    text-align:center;

    color:#777;

    border-top:1px solid rgba(255,255,255,0.05);
}



.menu-toggle{
    display:none;
    font-size:30px;
    color:#d4af37;
    cursor:pointer;
}












/* =========================
   RESPONSIVE
========================= */
@media(max-width:768px){

    nav{
        padding:15px 20px;
        flex-wrap:wrap;
    }

    .logo{
        font-size:22px;
    }

    .menu-toggle{
        display:block;
    }

    nav ul{
        display:none;
        width:100%;
        flex-direction:column;
        text-align:center;
        margin-top:20px;
        gap:18px;
    }

    nav ul.active{
        display:flex;
    }

    nav ul li a{
        display:block;
        padding:10px;
        font-size:16px;
    }

    .hero-content h1{
        font-size:50px;
    }

    .hero-content p{
        font-size:18px;
    }

    .contact h2{
        font-size:38px;
    }

    .contact-box{
        padding:35px 25px;
    }
}

</style>

</head>

<body>
